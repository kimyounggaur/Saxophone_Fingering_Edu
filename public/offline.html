<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f4efdf" />
    <title>SaxHands · 오프라인</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #f4efdf; color: #222822; }
      main { width: min(86vw, 28rem); padding: 2rem; border: 1px solid #b8a169; border-radius: 1.25rem; background: #fffaf0; box-shadow: 0 1rem 3rem #3c38281f; }
      h1 { font-family: Georgia, serif; margin: 0 0 .75rem; }
      p { line-height: 1.65; }
      button { min-height: 48px; border: 0; border-radius: .75rem; padding: 0 1rem; background: #8a6828; color: white; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #171b1a; color: #f4efdf; } main { background: #222827; } }
    </style>
  </head>
  <body>
    <main>
      <h1>연결이 잠시 끊겼어요</h1>
      <p>한 번 온라인에서 연 앱은 오프라인에서도 사용할 수 있습니다. 연결 후 SaxHands를 다시 열어 주세요.</p>
      <button type="button" onclick="location.reload()">다시 열기</button>
    </main>
  </body>
</html>
